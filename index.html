<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탈출! 조퇴 작전</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', '맑은 고딕', sans-serif;
        }

        body {
            background-color: #2b3a42;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background-color: #3f51b5;
            width: 100%;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffeb3b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .scene-img {
            width: 100%;
            height: 200px;
            background-color: #e0e0e0;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .story-box {
            background-color: #ffffff;
            color: #333;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            min-height: 80px;
            text-align: left;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #e68a00;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .restart-btn {
            background-color: #4caf50;
            margin-top: 10px;
        }

        .restart-btn:hover {
            background-color: #388e3c;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🏃‍♂️ 탈출! 조퇴 작전</h1>
        
        <div class="status-bar">
            <span>위험도: <span id="danger-level">0%</span></span>
            <span>체력: <span id="hp">100</span> HP</span>
        </div>

        <div class="scene-img" id="scene-icon">🏫</div>

        <div class="story-box" id="story-text">
            갑자기 머리가 아프고 집으로 돌아가고 싶어졌습니다. 무사히 조퇴 도장을 받고 집으로 탈출해야 합니다!
        </div>

        <div class="choices" id="choices-container">
            <button class="btn" onclick="makeChoice(1)">양호실로 이동해 엄살을 피운다.</button>
            <button class="btn" onclick="makeChoice(2)">담임 선생님께 솔직하게 집 가고 싶다고 말한다.</button>
            <button class="btn" onclick="makeChoice(3)">가방을 싸서 몰래 담장을 넘는다.</button>
        </div>
    </div>

    <script>
        let state = {
            danger: 0,
            hp: 100
        };

        const scenes = {
            start: {
                icon: "🏫",
                text: "갑자기 머리가 아프고 너무 집으로 가고 싶어졌습니다. 어떻게 조퇴 작전을 시작할까요?",
                choices: [
                    { text: "양호실(보건실)로 가서 아픈 척을 한다.", next: "infirmary" },
                    { text: "담임 선생님을 찾아가 진지하게 상담한다.", next: "teacher" },
                    { text: "선생님 눈을 피해 몰래 교문을 나간다.", next: "escape" }
                ]
            },
            infirmary: {
                icon: "🏥",
                text: "보건 선생님이 체온계를 들고 다가옵니다. 어떤 연기를 펼칠까요?",
                choices: [
                    { text: "배를 움켜쥐며 맹장염인 것 같다고 한다.", danger: 20, next: "infirmary_fail" },
                    { text: "열이 나는 것 같다며 어지러운 척을 한다.", danger: -10, next: "infirmary_success" }
                ]
            },
            infirmary_fail: {
                icon: "💊",
                text: "보건 선생님: '맹장이면 119 불러야겠다!' 연기가 들통나 소화제만 먹고 교실로 쫓겨났습니다. (위험도 상승)",
                choices: [
                    { text: "다음 기회를 노린다.", next: "teacher" }
                ]
            },
            infirmary_success: {
                icon: "📝",
                text: "보건 선생님: '체온은 정상이지만 얼굴이 안 좋아 보이네. 조퇴증 써줄 테니 담임 선생님께 가보렴!' 1단계 성공!",
                choices: [
                    { text: "조퇴증을 들고 담임 선생님에게 간다.", next: "teacher_stamp" }
                ]
            },
            teacher: {
                icon: "👨‍🏫",
                text: "담임 선생님이 날카로운 눈빛으로 바라봅니다. '무슨 일이니?'",
                choices: [
                    { text: "부모님이 집에서 기다리신다고 거짓말한다.", danger: 30, next: "teacher_call" },
                    { text: "몸이 너무 안 좋아서 집에서 쉬고 싶다고 한다.", danger: 10, next: "teacher_stamp" }
                ]
            },
            teacher_call: {
                icon: "📞",
                text: "선생님: '그래? 부모님께 확인 전화 드려볼게.' 전화 통화로 거짓말이 걸렸습니다!",
                choices: [
                    { text: "걸음아 나 살려라! 그냥 정문으로 튄다!", next: "escape" }
                ]
            },
            teacher_stamp: {
                icon: "🖋️",
                text: "담임 선생님이 조퇴 사유를 듣고 조퇴증에 도장을 찍어주었습니다! 이제 마지막으로 경비원 아저씨를 지나쳐야 합니다.",
                choices: [
                    { text: "당당하게 조퇴증을 보여주고 교문을 나간다.", next: "win" },
                    { text: "수상하게 경비실 눈치를 보며 기어간다.", danger: 50, next: "caught" }
                ]
            },
            escape: {
                icon: "🏃‍♂️",
                text: "담장을 넘으려는 순간, 멀리서 학생부장 선생님의 목소리가 들립니다! '거기 너 누구야?!'",
                choices: [
                    { text: "죽기 살기로 담장을 넘는다!", danger: 40, next: "escape_action" },
                    { text: "바로 무릎을 꿇고 죄송하다고 한다.", danger: 0, next: "start" }
                ]
            },
            escape_action: {
                icon: "🧱",
                text: "담장을 넘어 무사히 학교 밖으로 탈출했습니다! 단, 다음 날 벌점이 기다리고 있습니다.",
                choices: [
                    { text: "어쨌든 조퇴 성공! (대신 벌점 획득)", next: "win_escape" }
                ]
            },
            caught: {
                icon: "🚨",
                text: "경비원 아저씨에게 수상한 사람으로 오인받아 붙잡혔습니다. 조퇴 실패...",
                isEnd: true,
                success: false
            },
            win: {
                icon: "🎉",
                text: "축하합니다! 완벽한 명분과 절차로 당당하게 조퇴에 성공했습니다! 완벽한 승리!",
                isEnd: true,
                success: true
            },
            win_escape: {
                icon: "💨",
                text: "조퇴에는 성공했지만 위험천만한 탈출이었습니다! 절반의 성공!",
                isEnd: true,
                success: true
            }
        };

        let currentScene = "start";

        function updateUI() {
            const scene = scenes[currentScene];
            document.getElementById("scene-icon").innerText = scene.icon;
            document.getElementById("story-text").innerText = scene.text;
            document.getElementById("danger-level").innerText = state.danger + "%";
            document.getElementById("hp").innerText = state.hp;

            const choicesContainer = document.getElementById("choices-container");
            choicesContainer.innerHTML = "";

            if (scene.isEnd) {
                const restartBtn = document.createElement("button");
                restartBtn.className = "btn restart-btn";
                restartBtn.innerText = "처음부터 다시 하기";
                restartBtn.onclick = resetGame;
                choicesContainer.appendChild(restartBtn);
                return;
            }

            scene.choices.forEach((choice, index) => {
                const btn = document.createElement("button");
                btn.className = "btn";
                btn.innerText = choice.text;
                btn.onclick = () => selectChoice(choice);
                choicesContainer.appendChild(btn);
            });
        }

        function selectChoice(choice) {
            if (choice.danger) {
                state.danger += choice.danger;
            }

            if (state.danger >= 100) {
                currentScene = "caught";
            } else {
                currentScene = choice.next;
            }

            updateUI();
        }

        function resetGame() {
            state.danger = 0;
            state.hp = 100;
            currentScene = "start";
            updateUI();
        }

        // 초기 시작
        updateUI();
    </script>
</body>
</html>
